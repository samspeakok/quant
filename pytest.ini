[pytest]
# 默认把 warning 当错误：这条仓库的判据是"除了下面点名并解释过的上游项，其余一律不许有 warning"。
# 需要看完整警告列表时用 `pytest -W default` 覆盖即可。
filterwarnings =
    error
    # qlib/utils/index_data.py:492 `SingleIndexData.mean(axis=None)` 里 np.nanmean 吃到全空切片
    # （上游自己在那行上方写着 "FIXME: weird logic and not general"）。本机库里存在整段无价的标的，
    # 所以每次跑 D.features / 回测都会打出这条。它是 qlib 内部实现的噪音，不是本仓库代码的缺陷，
    # 也无法从外部修（要改 site-packages）。实测条数：tests/ 全跑一遍 120 条，全部来自这一行。
    ignore:Mean of empty slice:RuntimeWarning
